# ==========================================================
# OPSFLOW DOCKER COMPOSE
# ==========================================================
#
# Local containerized OpsFlow stack.
#
# Services:
#
#   db
#       PostgreSQL
#
#   migrate
#       One-shot Alembic database migration service
#
#   backend
#       FastAPI / Uvicorn
#
#   frontend
#       Production-built React application served through
#       unprivileged NGINX
#
# ==========================================================

services:
  # ========================================================
  # POSTGRESQL
  # ========================================================

  db:
    image: postgres:18.6-bookworm

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}

      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

      POSTGRES_DB: ${POSTGRES_DB:-opsflow}

    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"

    volumes:
      - opsflow_postgres_data:/var/lib/postgresql

      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']

      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

    networks:
      - opsflow_network

  # ========================================================
  # ALEMBIC MIGRATIONS
  # ========================================================
  #
  # One-shot service.
  #
  # Startup sequence:
  #
  #     db healthy
  #         |
  #         v
  #     migrate
  #         |
  #         +--> opsflow
  #         |
  #         +--> opsflow_test
  #         |
  #         v
  #     Exited (0)
  #
  # ========================================================

  migrate:
    # ------------------------------------------------------
    # IMAGE BUILD
    # ------------------------------------------------------

    build:
      context: ./backend

      dockerfile: Dockerfile

      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.13.15}

    image: opsflow-backend:dev

    # ------------------------------------------------------
    # APPLICATION CONFIGURATION
    # ------------------------------------------------------

    env_file:
      - ./backend/.env

    environment:
      # ----------------------------------------------------
      # APPLICATION MODE
      # ----------------------------------------------------

      APP_ENV: development

      # ----------------------------------------------------
      # BROWSER TRUST / CORS
      # ----------------------------------------------------
      #
      # The frontend remains browser-visible at:
      #
      #     http://localhost:5173
      #
      # even though NGINX listens on 8080 inside Docker.
      #
      # ----------------------------------------------------

      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}

      # ----------------------------------------------------
      # DATABASE
      # ----------------------------------------------------

      DATABASE_URL: >-
        postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-opsflow}

      TEST_DATABASE_URL: >-
        postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/opsflow_test

    # ------------------------------------------------------
    # DATABASE STARTUP ORDER
    # ------------------------------------------------------

    depends_on:
      db:
        condition: service_healthy

    # ------------------------------------------------------
    # MIGRATION COMMAND
    # ------------------------------------------------------

    command:
      - /bin/sh
      - -c
      - |
        set -eu

        echo "=================================================="
        echo "OpsFlow Alembic migration container"
        echo "=================================================="

        echo ""
        echo "Migrating primary database: opsflow"
        echo "--------------------------------------------------"

        python -m alembic upgrade head

        echo ""
        echo "Primary database migration complete."
        echo ""

        echo "Migrating test database: opsflow_test"
        echo "--------------------------------------------------"

        DATABASE_URL="$$TEST_DATABASE_URL" python -m alembic upgrade head

        echo ""
        echo "Test database migration complete."
        echo ""

        echo "=================================================="
        echo "All OpsFlow database migrations completed."
        echo "=================================================="

    # ------------------------------------------------------
    # RESTART POLICY
    # ------------------------------------------------------

    restart: "no"

    # ------------------------------------------------------
    # NETWORK
    # ------------------------------------------------------

    networks:
      - opsflow_network

  # ========================================================
  # FASTAPI BACKEND
  # ========================================================

  backend:
    # ------------------------------------------------------
    # IMAGE BUILD
    # ------------------------------------------------------

    build:
      context: ./backend

      dockerfile: Dockerfile

      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.13.15}

    image: opsflow-backend:dev

    # ------------------------------------------------------
    # APPLICATION CONFIGURATION
    # ------------------------------------------------------

    env_file:
      - ./backend/.env

    environment:
      # ----------------------------------------------------
      # APPLICATION MODE
      # ----------------------------------------------------

      APP_ENV: development

      # ----------------------------------------------------
      # BROWSER TRUST / CORS
      # ----------------------------------------------------

      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}

      # ----------------------------------------------------
      # DATABASE
      # ------------------------------------------------------

      DATABASE_URL: >-
        postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-opsflow}

      TEST_DATABASE_URL: >-
        postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/opsflow_test

    # ------------------------------------------------------
    # HOST PORT
    # ------------------------------------------------------
    #
    # Browser:
    #
    #     http://localhost:8000
    #
    # Docker network:
    #
    #     http://backend:8000
    #
    # ------------------------------------------------------

    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8000}:8000"

    # ------------------------------------------------------
    # APPLICATION STARTUP ORDER
    # ------------------------------------------------------

    depends_on:
      migrate:
        condition: service_completed_successfully

    # ------------------------------------------------------
    # NETWORK
    # ------------------------------------------------------

    networks:
      - opsflow_network

  # ========================================================
  # REACT PRODUCTION FRONTEND
  # ========================================================

  frontend:
    # ------------------------------------------------------
    # IMAGE BUILD
    # ------------------------------------------------------
    #
    # Stage 1:
    #
    #     Node / npm / TypeScript / Vite
    #
    # Stage 2:
    #
    #     unprivileged NGINX + compiled dist/
    #
    # ------------------------------------------------------

    build:
      context: ./frontend

      dockerfile: Dockerfile

      args:
        NODE_VERSION: ${NODE_VERSION:-24}

        # --------------------------------------------------
        # VITE BUILD-TIME CONFIGURATION
        # --------------------------------------------------
        #
        # These values become browser-visible JavaScript
        # configuration during npm run build.
        #
        # They are not runtime secrets.
        #
        # --------------------------------------------------

        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}

        VITE_CSRF_COOKIE_NAME: ${VITE_CSRF_COOKIE_NAME:-opsflow_csrf}

    image: opsflow-frontend:prod

    # ------------------------------------------------------
    # HOST / CONTAINER PORT
    # ------------------------------------------------------
    #
    # Host browser:
    #
    #     http://localhost:5173
    #
    # Container:
    #
    #     NGINX :8080
    #
    # Keeping the host origin unchanged avoids unnecessary
    # CORS and authentication-origin changes.
    #
    # ------------------------------------------------------

    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-5173}:8080"

    # ------------------------------------------------------
    # NO DEVELOPMENT BIND MOUNTS
    # ------------------------------------------------------
    #
    # There is intentionally no:
    #
    #     ./frontend:/app
    #
    # and no persistent node_modules volume.
    #
    # The runtime image is immutable build output.
    #
    # ------------------------------------------------------

    # ------------------------------------------------------
    # BACKEND STARTUP RELATIONSHIP
    # ------------------------------------------------------

    depends_on:
      backend:
        condition: service_started

    # ------------------------------------------------------
    # NETWORK
    # ------------------------------------------------------

    networks:
      - opsflow_network

# ==========================================================
# PERSISTENT VOLUMES
# ==========================================================

volumes:
  opsflow_postgres_data:
    name: opsflow_postgres_data

# ==========================================================
# NETWORKS
# ==========================================================

networks:
  opsflow_network:
    name: opsflow_network

    driver: bridge
