# ==========================================================
# OPSFLOW DOCKER COMPOSE
# ==========================================================
#
# Local containerized OpsFlow stack.
#
# Services:
#
#   db
#       PostgreSQL
#
#   migrate
#       One-shot Alembic database migration service
#
#   backend
#       FastAPI / Uvicorn
#
#   frontend
#       Production-built React application served through
#       unprivileged NGINX
#
#
# Startup readiness chain:
#
#     db healthy
#         |
#         v
#     migrate exits 0
#         |
#         v
#     backend healthy
#         |
#         v
#     frontend starts and becomes healthy
#
# ==========================================================

services:
  # ========================================================
  # POSTGRESQL
  # ========================================================

  db:
    image: postgres:18.6-bookworm

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}

      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

      POSTGRES_DB: ${POSTGRES_DB:-opsflow}

    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"

    volumes:
      - opsflow_postgres_data:/var/lib/postgresql

      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"'

      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

    networks:
      - opsflow_network

  # ========================================================
  # ALEMBIC MIGRATIONS
  # ========================================================
  #
  # This is intentionally a one-shot service.
  #
  # Its successful lifecycle is:
  #
  #     Created
  #        |
  #        v
  #     Running
  #        |
  #        v
  #     Exited (0)
  #
  # A persistent Docker healthcheck is therefore NOT the
  # correct readiness contract for this service.
  #
  # ========================================================

  migrate:
    # ------------------------------------------------------
    # IMAGE BUILD
    # ------------------------------------------------------

    build:
      context: ./backend

      dockerfile: Dockerfile

      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.13.15}

    image: opsflow-backend:dev

    # ------------------------------------------------------
    # APPLICATION CONFIGURATION
    # ------------------------------------------------------

    env_file:
      - ./backend/.env

    environment:
      APP_ENV: development

      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}

      DATABASE_URL: >-
        postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-opsflow}

      TEST_DATABASE_URL: >-
        postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/opsflow_test

    # ------------------------------------------------------
    # DATABASE READINESS
    # ------------------------------------------------------

    depends_on:
      db:
        condition: service_healthy

    # ------------------------------------------------------
    # MIGRATION COMMAND
    # ------------------------------------------------------

    command:
      - /bin/sh
      - -c
      - |
        set -eu

        echo "=================================================="
        echo "OpsFlow Alembic migration container"
        echo "=================================================="

        echo ""
        echo "Migrating primary database: opsflow"
        echo "--------------------------------------------------"

        python -m alembic upgrade head

        echo ""
        echo "Primary database migration complete."
        echo ""

        echo "Migrating test database: opsflow_test"
        echo "--------------------------------------------------"

        DATABASE_URL="$$TEST_DATABASE_URL" python -m alembic upgrade head

        echo ""
        echo "Test database migration complete."
        echo ""

        echo "=================================================="
        echo "All OpsFlow database migrations completed."
        echo "=================================================="

    # ------------------------------------------------------
    # ONE-SHOT RESTART POLICY
    # ------------------------------------------------------

    restart: "no"

    # ------------------------------------------------------
    # NETWORK
    # ------------------------------------------------------

    networks:
      - opsflow_network

  # ========================================================
  # FASTAPI BACKEND
  # ========================================================

  backend:
    # ------------------------------------------------------
    # IMAGE BUILD
    # ------------------------------------------------------

    build:
      context: ./backend

      dockerfile: Dockerfile

      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.13.15}

    image: opsflow-backend:dev

    # ------------------------------------------------------
    # APPLICATION CONFIGURATION
    # ------------------------------------------------------

    env_file:
      - ./backend/.env

    environment:
      APP_ENV: development

      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}

      DATABASE_URL: >-
        postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-opsflow}

      TEST_DATABASE_URL: >-
        postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/opsflow_test

    # ------------------------------------------------------
    # HOST PORT
    # ------------------------------------------------------

    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8000}:8000"

    # ------------------------------------------------------
    # STARTUP DEPENDENCY
    # ------------------------------------------------------
    #
    # Do not start FastAPI until database migrations have
    # completed successfully.
    #
    # ------------------------------------------------------

    depends_on:
      migrate:
        condition: service_completed_successfully

    # ------------------------------------------------------
    # BACKEND HEALTH CONTRACT
    # ------------------------------------------------------
    #
    # The image intentionally does not install curl solely
    # for a health check.
    #
    # Python is already required by the application, so the
    # standard library performs the local HTTP request.
    #
    # The existing public OpsFlow endpoint is:
    #
    #     /api/v1/health
    #
    # urllib raises an exception for connection failures and
    # non-success HTTP responses, causing the command to
    # return a non-zero status.
    #
    # ------------------------------------------------------

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          'http://127.0.0.1:8000/api/v1/health',
          timeout=2
          ).read()

      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

    # ------------------------------------------------------
    # NETWORK
    # ------------------------------------------------------

    networks:
      - opsflow_network

  # ========================================================
  # REACT PRODUCTION FRONTEND
  # ========================================================

  frontend:
    # ------------------------------------------------------
    # IMAGE BUILD
    # ------------------------------------------------------

    build:
      context: ./frontend

      dockerfile: Dockerfile

      args:
        NODE_VERSION: ${NODE_VERSION:-24}

        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}

        VITE_CSRF_COOKIE_NAME: ${VITE_CSRF_COOKIE_NAME:-opsflow_csrf}

    image: opsflow-frontend:prod

    # ------------------------------------------------------
    # HOST / CONTAINER PORT
    # ------------------------------------------------------

    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-5173}:8080"

    # ------------------------------------------------------
    # BACKEND READINESS DEPENDENCY
    # ------------------------------------------------------
    #
    # Previous Phase 8.6.4:
    #
    #     condition: service_started
    #
    # That merely proved that the backend process existed.
    #
    # Phase 8.6.5:
    #
    #     condition: service_healthy
    #
    # Now NGINX is not started until FastAPI has satisfied
    # its explicit HTTP health contract.
    #
    # ------------------------------------------------------

    depends_on:
      backend:
        condition: service_healthy

    # ------------------------------------------------------
    # FRONTEND HEALTH CONTRACT
    # ------------------------------------------------------
    #
    # /healthz is served directly by NGINX.
    #
    # This check proves that the web server is accepting HTTP
    # traffic without depending on:
    #
    #     React execution
    #     authentication
    #     FastAPI
    #     PostgreSQL
    #
    # ------------------------------------------------------

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -O /dev/null
          http://127.0.0.1:8080/healthz
          || exit 1

      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

    # ------------------------------------------------------
    # NETWORK
    # ------------------------------------------------------

    networks:
      - opsflow_network

# ==========================================================
# PERSISTENT VOLUMES
# ==========================================================

volumes:
  opsflow_postgres_data:
    name: opsflow_postgres_data

# ==========================================================
# NETWORKS
# ==========================================================

networks:
  opsflow_network:
    name: opsflow_network

    driver: bridge
