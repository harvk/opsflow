# ==========================================================
# OPSFLOW DOCKER COMPOSE
# ==========================================================
#
# Hardened local containerized OpsFlow stack.
#
# Startup chain:
#
#   PostgreSQL healthy
#           |
#           v
#   migrations complete successfully
#           |
#           v
#   backend healthy
#           |
#           v
#   frontend healthy
#
# Runtime containment:
#
#   backend / migrate / frontend
#       - no-new-privileges
#       - all Linux capabilities dropped
#       - read-only root filesystem
#       - controlled writable /tmp
#
# Persistent services:
#
#   db / backend / frontend
#       - restart unless explicitly stopped
#
# ==========================================================

services:
  # ========================================================
  # POSTGRESQL
  # ========================================================

  db:
    image: postgres:18.6-bookworm

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}

      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

      POSTGRES_DB: ${POSTGRES_DB:-opsflow}

    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"

    volumes:
      - opsflow_postgres_data:/var/lib/postgresql

      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"'

      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

    # ------------------------------------------------------
    # RESTART POLICY
    # ------------------------------------------------------
    #
    # PostgreSQL is a persistent service.
    #
    # Restart it after abnormal termination or Docker daemon
    # restart unless an operator explicitly stopped it.
    #
    # ------------------------------------------------------

    restart: unless-stopped

    networks:
      - opsflow_network

    # ========================================================
  # ALEMBIC MIGRATIONS
  # ========================================================
  #
  # One-shot database schema migration service.
  #
  # SECURITY BOUNDARY:
  #
  # This service deliberately does NOT consume:
  #
  #     backend/.env
  #
  # Alembic requires only database connectivity.
  #
  # Therefore application secrets such as JWT keys, CSRF
  # signing material, throttle secrets, security-event HMAC
  # material, AWS/SES configuration, and password-reset
  # configuration are not exposed to this container.
  #
  # ========================================================

  migrate:
    build:
      context: ./backend

      dockerfile: Dockerfile

      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.13.15}

    image: opsflow-backend:dev

    # ------------------------------------------------------
    # MINIMAL MIGRATION ENVIRONMENT
    # ------------------------------------------------------
    #
    # DATABASE_URL:
    #
    #     primary opsflow database
    #
    # TEST_DATABASE_URL:
    #
    #     opsflow_test database
    #
    # These are the only OpsFlow configuration values
    # required by the migration process.
    #
    # ------------------------------------------------------

    environment:
      DATABASE_URL: >-
        postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-opsflow}

      TEST_DATABASE_URL: >-
        postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/opsflow_test

    # ------------------------------------------------------
    # DATABASE READINESS
    # ------------------------------------------------------

    depends_on:
      db:
        condition: service_healthy

    # ------------------------------------------------------
    # MIGRATION COMMAND
    # ------------------------------------------------------

    command:
      - /bin/sh
      - -c
      - |
        set -eu

        echo "=================================================="
        echo "OpsFlow Alembic migration container"
        echo "=================================================="

        echo ""
        echo "Migrating primary database: opsflow"
        echo "--------------------------------------------------"

        python -m alembic upgrade head

        echo ""
        echo "Primary database migration complete."
        echo ""

        echo "Migrating test database: opsflow_test"
        echo "--------------------------------------------------"

        DATABASE_URL="$$TEST_DATABASE_URL" python -m alembic upgrade head

        echo ""
        echo "Test database migration complete."
        echo ""

        echo "=================================================="
        echo "All OpsFlow database migrations completed."
        echo "=================================================="

    # ------------------------------------------------------
    # ONE-SHOT LIFECYCLE
    # ------------------------------------------------------

    restart: "no"

    # ------------------------------------------------------
    # PRIVILEGE CONTAINMENT
    # ------------------------------------------------------

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    # ------------------------------------------------------
    # FILESYSTEM CONTAINMENT
    # ------------------------------------------------------

    read_only: true

    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m

    # ------------------------------------------------------
    # NETWORK
    # ------------------------------------------------------

    networks:
      - opsflow_network

  # ========================================================
  # FASTAPI BACKEND
  # ========================================================

  backend:
    build:
      context: ./backend

      dockerfile: Dockerfile

      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.13.15}

    image: opsflow-backend:dev

    env_file:
      - ./backend/.env

    environment:
      APP_ENV: development

      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}

      DATABASE_URL: >-
        postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-opsflow}

      TEST_DATABASE_URL: >-
        postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/opsflow_test

    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8000}:8000"

    depends_on:
      migrate:
        condition: service_completed_successfully

    # ------------------------------------------------------
    # BACKEND HEALTH CONTRACT
    # ------------------------------------------------------

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          'http://127.0.0.1:8000/api/v1/health',
          timeout=2
          ).read()

      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

    # ------------------------------------------------------
    # RESTART POLICY
    # ------------------------------------------------------

    restart: unless-stopped

    # ------------------------------------------------------
    # PRIVILEGE CONTAINMENT
    # ------------------------------------------------------
    #
    # FastAPI already executes as UID/GID 10001.
    #
    # These controls ensure that process cannot later gain
    # additional privileges or use Linux capabilities that
    # the HTTP API does not require.
    #
    # ------------------------------------------------------

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    # ------------------------------------------------------
    # READ-ONLY ROOT FILESYSTEM
    # ------------------------------------------------------

    read_only: true

    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m

    networks:
      - opsflow_network

  # ========================================================
  # REACT PRODUCTION FRONTEND
  # ========================================================

  frontend:
    build:
      context: ./frontend

      dockerfile: Dockerfile

      args:
        NODE_VERSION: ${NODE_VERSION:-24}

        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}

        VITE_CSRF_COOKIE_NAME: ${VITE_CSRF_COOKIE_NAME:-opsflow_csrf}

    image: opsflow-frontend:prod

    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-5173}:8080"

    depends_on:
      backend:
        condition: service_healthy

    # ------------------------------------------------------
    # FRONTEND HEALTH CONTRACT
    # ------------------------------------------------------

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -O /dev/null
          http://127.0.0.1:8080/healthz
          || exit 1

      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

    # ------------------------------------------------------
    # RESTART POLICY
    # ------------------------------------------------------

    restart: unless-stopped

    # ------------------------------------------------------
    # PRIVILEGE CONTAINMENT
    # ------------------------------------------------------
    #
    # nginx-unprivileged already runs without root.
    #
    # Port 8080 is non-privileged, so NGINX does not require
    # CAP_NET_BIND_SERVICE.
    #
    # ------------------------------------------------------

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    # ------------------------------------------------------
    # READ-ONLY ROOT FILESYSTEM
    # ------------------------------------------------------
    #
    # The unprivileged NGINX image stores its runtime PID and
    # temporary data beneath /tmp.
    #
    # We therefore make only /tmp writable.
    #
    # ------------------------------------------------------

    read_only: true

    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m

    networks:
      - opsflow_network

# ==========================================================
# PERSISTENT VOLUMES
# ==========================================================

volumes:
  opsflow_postgres_data:
    name: opsflow_postgres_data

# ==========================================================
# NETWORKS
# ==========================================================

networks:
  opsflow_network:
    name: opsflow_network

    driver: bridge
