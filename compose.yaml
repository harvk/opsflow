# ==========================================================
# OPSFLOW DOCKER COMPOSE
# ==========================================================
#
# Hardened local containerized OpsFlow stack.
#
# Startup chain:
#
#   PostgreSQL healthy
#           |
#           v
#   migrations complete successfully
#           |
#           v
#   backend healthy
#           |
#           v
#   frontend healthy
#
#
# Network segmentation:
#
#   opsflow_backend_network
#       db
#       migrate
#       backend
#
#   opsflow_frontend_network
#       frontend
#
# React executes in the HOST BROWSER.
#
# Browser traffic:
#
#   localhost:5173 -> frontend NGINX
#   localhost:8000 -> FastAPI
#
# The frontend container itself therefore has no legitimate
# requirement to communicate directly with backend or db.
#
# ==========================================================

services:
  # ========================================================
  # POSTGRESQL
  # ========================================================

  db:
    image: postgres:18.6-bookworm

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}

      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

      POSTGRES_DB: ${POSTGRES_DB:-opsflow}

    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"

    volumes:
      - opsflow_postgres_data:/var/lib/postgresql

      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"'

      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

    restart: unless-stopped

    networks:
      - opsflow_backend_network

  # ========================================================
  # ALEMBIC MIGRATIONS
  # ========================================================
  #
  # One-shot migration service.
  #
  # Security boundary:
  #
  #   - explicit non-root runtime identity
  #   - database configuration only
  #   - no application secret env file
  #   - no Linux capabilities
  #   - no-new-privileges
  #   - read-only root filesystem
  #   - bounded process count
  #   - backend-only network
  #
  # Supply-chain metadata:
  #
  #   - max-mode provenance attestation
  #   - SBOM attestation
  #
  # ========================================================

  migrate:
    build:
      context: ./backend

      dockerfile: Dockerfile

      provenance: mode=max

      sbom: true

      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.13.15}

    image: opsflow-backend:dev

    # ------------------------------------------------------
    # EXPLICIT RUNTIME IDENTITY
    # ------------------------------------------------------
    #
    # The Dockerfile already defines UID/GID 10001.
    #
    # Repeating it here prevents an accidental future
    # Dockerfile USER regression from silently causing the
    # migration service to execute as root.
    #
    # ------------------------------------------------------

    user: "10001:10001"

    # ------------------------------------------------------
    # MINIMAL MIGRATION CONFIGURATION
    # ------------------------------------------------------

    environment:
      DATABASE_URL: >-
        postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-opsflow}

      TEST_DATABASE_URL: >-
        postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/opsflow_test

    # ------------------------------------------------------
    # DATABASE READINESS
    # ------------------------------------------------------

    depends_on:
      db:
        condition: service_healthy

    # ------------------------------------------------------
    # MIGRATION COMMAND
    # ------------------------------------------------------

    command:
      - /bin/sh
      - -c
      - |
        set -eu

        echo "=================================================="
        echo "OpsFlow Alembic migration container"
        echo "=================================================="

        echo ""
        echo "Migrating primary database: opsflow"
        echo "--------------------------------------------------"

        python -m alembic upgrade head

        echo ""
        echo "Primary database migration complete."
        echo ""

        echo "Migrating test database: opsflow_test"
        echo "--------------------------------------------------"

        DATABASE_URL="$$TEST_DATABASE_URL" python -m alembic upgrade head

        echo ""
        echo "Test database migration complete."
        echo ""

        echo "=================================================="
        echo "All OpsFlow database migrations completed."
        echo "=================================================="

    # ------------------------------------------------------
    # ONE-SHOT LIFECYCLE
    # ------------------------------------------------------

    restart: "no"

    # ------------------------------------------------------
    # PROCESS CEILING
    # ------------------------------------------------------
    #
    # Alembic needs only a very small number of processes.
    #
    # 128 intentionally leaves generous headroom while still
    # bounding process creation.
    #
    # ------------------------------------------------------

    pids_limit: 128

    # ------------------------------------------------------
    # PRIVILEGE CONTAINMENT
    # ------------------------------------------------------

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    # ------------------------------------------------------
    # FILESYSTEM CONTAINMENT
    # ------------------------------------------------------

    read_only: true

    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m

    # ------------------------------------------------------
    # PRIVATE BACKEND NETWORK
    # ------------------------------------------------------

    networks:
      - opsflow_backend_network

  # ========================================================
  # FASTAPI BACKEND
  # ========================================================

  backend:
    build:
      context: ./backend

      dockerfile: Dockerfile

      provenance: mode=max

      sbom: true

      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.13.15}

    image: opsflow-backend:dev

    # ------------------------------------------------------
    # EXPLICIT RUNTIME IDENTITY
    # ------------------------------------------------------

    user: "10001:10001"

    # ------------------------------------------------------
    # APPLICATION CONFIGURATION
    # ------------------------------------------------------

    env_file:
      - ./backend/.env

    environment:
      APP_ENV: development

      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}

      DATABASE_URL: >-
        postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-opsflow}

      TEST_DATABASE_URL: >-
        postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/opsflow_test

    # ------------------------------------------------------
    # HOST PORT
    # ------------------------------------------------------

    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8000}:8000"

    # ------------------------------------------------------
    # STARTUP ORDER
    # ------------------------------------------------------

    depends_on:
      migrate:
        condition: service_completed_successfully

    # ------------------------------------------------------
    # HEALTH CONTRACT
    # ------------------------------------------------------

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          'http://127.0.0.1:8000/api/v1/health',
          timeout=2
          ).read()

      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

    # ------------------------------------------------------
    # RESTART POLICY
    # ------------------------------------------------------

    restart: unless-stopped

    # ------------------------------------------------------
    # PROCESS CEILING
    # ------------------------------------------------------
    #
    # OpsFlow currently runs one Uvicorn application process.
    #
    # 128 provides substantial headroom while preventing an
    # uncontrolled process explosion.
    #
    # Reevaluate this value if the deployment later uses
    # Gunicorn, multiple worker processes, or additional
    # process-heavy workloads.
    #
    # ------------------------------------------------------

    pids_limit: 128

    # ------------------------------------------------------
    # PRIVILEGE CONTAINMENT
    # ------------------------------------------------------

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    # ------------------------------------------------------
    # FILESYSTEM CONTAINMENT
    # ------------------------------------------------------

    read_only: true

    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m

    # ------------------------------------------------------
    # PRIVATE BACKEND NETWORK
    # ------------------------------------------------------

    networks:
      - opsflow_backend_network

  # ========================================================
  # REACT PRODUCTION FRONTEND
  # ========================================================

  frontend:
    build:
      context: ./frontend

      dockerfile: Dockerfile

      provenance: mode=max

      sbom: true

      args:
        NODE_VERSION: ${NODE_VERSION:-24}

        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}

        VITE_CSRF_COOKIE_NAME: ${VITE_CSRF_COOKIE_NAME:-opsflow_csrf}

    image: opsflow-frontend:prod

    # ------------------------------------------------------
    # HOST / CONTAINER PORT
    # ------------------------------------------------------

    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-5173}:8080"

    # ------------------------------------------------------
    # STARTUP ORDER
    # ------------------------------------------------------
    #
    # Compose can use backend health state for orchestration
    # even though frontend and backend do not share a Docker
    # network.
    #
    # This does NOT create network connectivity between them.
    #
    # ------------------------------------------------------

    depends_on:
      backend:
        condition: service_healthy

    # ------------------------------------------------------
    # FRONTEND HEALTH CONTRACT
    # ------------------------------------------------------

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -O /dev/null
          http://127.0.0.1:8080/healthz
          || exit 1

      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

    # ------------------------------------------------------
    # RESTART POLICY
    # ------------------------------------------------------

    restart: unless-stopped

    # ------------------------------------------------------
    # PROCESS CEILING
    # ------------------------------------------------------
    #
    # NGINX requires a small master/worker process set.
    #
    # 64 leaves ample operational headroom while bounding
    # process creation.
    #
    # ------------------------------------------------------

    pids_limit: 64

    # ------------------------------------------------------
    # PRIVILEGE CONTAINMENT
    # ------------------------------------------------------

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    # ------------------------------------------------------
    # FILESYSTEM CONTAINMENT
    # ------------------------------------------------------

    read_only: true

    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m

    # ------------------------------------------------------
    # FRONTEND-ONLY NETWORK
    # ------------------------------------------------------

    networks:
      - opsflow_frontend_network

# ==========================================================
# PERSISTENT VOLUMES
# ==========================================================

volumes:
  opsflow_postgres_data:
    name: opsflow_postgres_data

# ==========================================================
# NETWORKS
# ==========================================================

networks:
  opsflow_backend_network:
    name: opsflow_backend_network

    driver: bridge

  opsflow_frontend_network:
    name: opsflow_frontend_network

    driver: bridge
