name: OpsFlow Quality

on:
  push:
    branches:
      - main
      - feature/distributed-authentication
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opsflow-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  whitespace:
    name: Whitespace
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Check trailing whitespace
        run: python scripts/trim_trailing_whitespace.py --check

      - name: Check Git whitespace errors
        run: git diff --check

      - name: Check distributed-authentication production contract
        run: python scripts/check_distributed_auth_contract.py

  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_USER: opsflow
          POSTGRES_PASSWORD: opsflow_ci_password
          POSTGRES_DB: opsflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opsflow -d opsflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      FRONTEND_ORIGIN: http://localhost:5173
      DATABASE_URL: postgresql+psycopg://opsflow:opsflow_ci_password@localhost:5432/opsflow
      TEST_DATABASE_URL: postgresql+psycopg://opsflow:opsflow_ci_password@localhost:5432/opsflow_test
      JWT_SECRET_KEY: backend-ci-access-token-secret
      JWT_REFRESH_SECRET_KEY: backend-ci-refresh-token-secret
      JWT_REAUTH_SECRET_KEY: backend-ci-reauth-token-secret
      CSRF_SECRET_KEY: backend-ci-csrf-secret
      AUTH_THROTTLE_SECRET_KEY: backend-ci-auth-throttle-secret
      SECURITY_EVENT_HMAC_KEY: backend-ci-security-event-hmac-secret
      AWS_REGION: us-east-1
      SES_FROM_EMAIL: admin@example.com
      INCIDENT_GATEWAY_MODE: local
      METRICS_ENABLED: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-runtime.txt

      - name: Install Backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate service identity key generator
        run: |
          output_directory="${RUNNER_TEMP}/opsflow-service-identity"

          python scripts/generate_service_identity_keys.py \
            --output-directory "${output_directory}"

          test -s "${output_directory}/core-service-identity-private.pem"
          test -s "${output_directory}/core-service-identity-public.pem"

      - name: Validate Incident Service identity key generator
        run: |
          output_directory="${RUNNER_TEMP}/opsflow-incident-service-identity"

          python scripts/generate_incident_service_identity_keys.py \
            --output-directory "${output_directory}"

          test -s "${output_directory}/incident-service-identity-private.pem"
          test -s "${output_directory}/incident-service-identity-public.pem"

      - name: Create Backend test database
        run: |
          docker exec \
            "${{ job.services.postgres.id }}" \
            createdb \
            --username=opsflow \
            opsflow_test

      - name: Run Backend database migrations
        working-directory: backend
        run: |
          python -m alembic upgrade head
          DATABASE_URL="${TEST_DATABASE_URL}" python -m alembic upgrade head

      - name: Run Backend Ruff checks
        working-directory: backend
        run: python -m ruff check app tests

      - name: Run Backend distributed-authentication security tests
        working-directory: backend
        run: |
          python -m pytest -q \
            tests/test_service_token_verifier.py \
            tests/test_service_auth_adversarial.py \
            tests/test_service_security_events.py \
            tests/test_metrics.py

      - name: Run Backend tests
        working-directory: backend
        run: python -m pytest -q

  incident-service:
    name: Incident Service
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_USER: opsflow
          POSTGRES_PASSWORD: opsflow_ci_password
          POSTGRES_DB: opsflow_incidents
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opsflow -d opsflow_incidents"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://opsflow:opsflow_ci_password@localhost:5432/opsflow_incidents
      TEST_DATABASE_URL: postgresql+psycopg://opsflow:opsflow_ci_password@localhost:5432/opsflow_incidents_test
      CORE_BACKEND_URL: http://backend:8000/api/v1
      METRICS_ENABLED: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            incident-service/requirements.txt
            incident-service/requirements-runtime.txt

      - name: Install Incident Service dependencies
        working-directory: incident-service
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Create Incident Service test database
        run: |
          docker exec \
            "${{ job.services.postgres.id }}" \
            createdb \
            --username=opsflow \
            opsflow_incidents_test

      - name: Run Incident Service database migrations
        working-directory: incident-service
        run: |
          python -m alembic upgrade head
          DATABASE_URL="${TEST_DATABASE_URL}" python -m alembic upgrade head

      - name: Run Incident Service Ruff checks
        working-directory: incident-service
        run: python -m ruff check app tests

      - name: Run Incident Service distributed-authentication security tests
        working-directory: incident-service
        run: |
          python -m pytest -q \
            tests/test_service_identity.py \
            tests/test_service_auth_adversarial.py \
            tests/test_service_security_events.py \
            tests/test_metrics.py

      - name: Run Incident Service tests
        working-directory: incident-service
        run: python -m pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Oxlint
        working-directory: frontend
        run: npm run lint

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test:run

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  compose-smoke:
    name: Compose smoke
    runs-on: ubuntu-latest
    needs:
      - whitespace
      - backend
      - incident-service
      - frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v2
        with:
          version: v2.39.0

      - name: Show Docker Compose version
        run: docker compose version

      - name: Create CI environment files
        run: |
          cp .env.docker.example .env.docker
          cp backend/.env.example backend/.env

      - name: Generate ephemeral service identity keys
        run: |
          mkdir -p .opsflow-secrets

          openssl genpkey \
            -algorithm RSA \
            -pkeyopt rsa_keygen_bits:2048 \
            -out .opsflow-secrets/core-service-identity-private.pem

          openssl pkey \
            -in .opsflow-secrets/core-service-identity-private.pem \
            -pubout \
            -out .opsflow-secrets/core-service-identity-public.pem

          openssl genpkey \
            -algorithm RSA \
            -pkeyopt rsa_keygen_bits:2048 \
            -out .opsflow-secrets/incident-service-identity-private.pem

          openssl pkey \
            -in .opsflow-secrets/incident-service-identity-private.pem \
            -pubout \
            -out .opsflow-secrets/incident-service-identity-public.pem

          sudo chown 10001:10001 \
            .opsflow-secrets/core-service-identity-private.pem \
            .opsflow-secrets/core-service-identity-public.pem \
            .opsflow-secrets/incident-service-identity-private.pem \
            .opsflow-secrets/incident-service-identity-public.pem

          chmod 0400 \
            .opsflow-secrets/core-service-identity-private.pem \
            .opsflow-secrets/incident-service-identity-private.pem

          chmod 0444 \
            .opsflow-secrets/core-service-identity-public.pem \
            .opsflow-secrets/incident-service-identity-public.pem

      - name: Validate Compose configuration
        run: docker compose --env-file .env.docker config --quiet

      - name: Validate service identity Compose key boundaries
        run: |
          python scripts/validate_service_identity_compose.py \
            --env-file .env.docker

      - name: Build Compose images
        run: |
          docker compose --env-file .env.docker build \
            backend \
            incident-service \
            frontend

      - name: Start Compose stack
        run: |
          docker compose --env-file .env.docker up \
            --detach \
            --wait

      - name: Show Compose service state
        run: docker compose --env-file .env.docker ps

      - name: Check Backend health
        run: curl --fail --silent --show-error http://localhost:8000/api/v1/health

      - name: Check Backend metrics
        run: |
          curl --fail --silent --show-error http://localhost:8000/metrics \
            | grep "opsflow_http_requests_total"

      - name: Check Core service identity issuance
        run: |
          docker compose --env-file .env.docker exec -T backend \
            python -c "from app.core.config import settings; from app.core.service_identity import ServiceScope; from app.core.service_identity_provider import get_service_token_provider; token = get_service_token_provider().create_token(audience=settings.incident_service_audience, scopes={ServiceScope.INCIDENTS_READ}); assert token.count('.') == 2; print('Core service identity issuance passed')"

      - name: Verify Backend runtime key isolation
        run: |
          docker compose --env-file .env.docker exec -T backend \
            python - <<'PY'
          from pathlib import Path

          assert Path(
              "/run/secrets/core_service_identity_private_key"
          ).is_file()
          assert Path(
              "/run/secrets/incident_service_identity_public_key"
          ).is_file()
          assert not Path(
              "/run/secrets/core_service_identity_public_key"
          ).exists()
          assert not Path(
              "/run/secrets/incident_service_identity_private_key"
          ).exists()
          print("Backend runtime key isolation passed")
          PY

      - name: Verify Incident Service runtime key isolation
        run: |
          docker compose --env-file .env.docker exec -T incident-service \
            python - <<'PY'
          from pathlib import Path

          assert Path(
              "/run/secrets/core_service_identity_public_key"
          ).is_file()
          assert Path(
              "/run/secrets/incident_service_identity_private_key"
          ).is_file()
          assert not Path(
              "/run/secrets/core_service_identity_private_key"
          ).exists()
          assert not Path(
              "/run/secrets/incident_service_identity_public_key"
          ).exists()
          print("Incident Service runtime key isolation passed")
          PY

      - name: Check Core-signed request to Incident Service
        run: |
          docker compose --env-file .env.docker exec -T backend \
            python - <<'PY'
          import httpx

          from app.core.config import settings
          from app.core.service_identity import ServiceScope
          from app.core.service_identity_provider import (
              get_service_token_provider,
          )

          token = get_service_token_provider().create_token(
              audience=settings.incident_service_audience,
              scopes={ServiceScope.INCIDENTS_READ},
          )
          response = httpx.get(
              "http://incident-service:8000/api/v1/incidents",
              headers={"Authorization": f"Bearer {token}"},
              timeout=5.0,
          )
          response.raise_for_status()
          print("Core-signed request to Incident Service passed")
          PY

      - name: Check Incident-signed request to Core Backend
        run: |
          docker compose --env-file .env.docker exec -T incident-service \
            python - <<'PY'
          import httpx

          from app.core.config import get_settings
          from app.core.service_identity import ServiceScope
          from app.core.service_token_provider import (
              get_service_token_provider,
          )

          settings = get_settings()
          token = get_service_token_provider().create_token(
              audience=settings.core_backend_audience,
              scopes={ServiceScope.SERVICES_READ},
          )
          response = httpx.get(
              f"{settings.core_backend_url}/internal/services/"
              "00000000-0000-4000-8000-000000000001/exists",
              headers={"Authorization": f"Bearer {token}"},
              timeout=5.0,
          )
          response.raise_for_status()
          print("Incident-signed request to Core Backend passed")
          PY

      - name: Check private Incident Service health
        run: |
          docker compose --env-file .env.docker exec -T backend \
            python -c "import urllib.request; print(urllib.request.urlopen('http://incident-service:8000/api/v1/health', timeout=5).read().decode())"

      - name: Check frontend health
        run: curl --fail --silent --show-error http://localhost:5173/healthz

      - name: Show Compose logs after failure
        if: failure()
        run: docker compose --env-file .env.docker logs --no-color --tail=300

      - name: Stop Compose stack
        if: always()
        run: |
          docker compose --env-file .env.docker down \
            --volumes \
            --remove-orphans
