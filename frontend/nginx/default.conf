# ==========================================================
# OPSFLOW FRONTEND — NGINX STATIC SERVER
# ==========================================================
#
# The React/Vite application is compiled during the Docker
# build and copied into:
#
#     /usr/share/nginx/html
#
# NGINX serves only those compiled static artifacts.
#
# React Router handles application routes in the browser.
# Unknown filesystem paths therefore fall back to
# index.html instead of returning an NGINX 404.
#
# ==========================================================


server {
    # ------------------------------------------------------
    # LISTEN PORT
    # ------------------------------------------------------
    #
    # 8080 is intentionally non-privileged.
    #
    # The Windows host will continue publishing the service
    # as localhost:5173 so the application's browser origin
    # remains unchanged.
    #
    # ------------------------------------------------------

    listen 8080;
    listen [::]:8080;

    server_name _;


    # ------------------------------------------------------
    # STATIC APPLICATION ROOT
    # ------------------------------------------------------

    root /usr/share/nginx/html;
    index index.html;


    # ------------------------------------------------------
    # BASIC SERVER HARDENING
    # ------------------------------------------------------

    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;


    # ------------------------------------------------------
    # INDEX.HTML
    # ------------------------------------------------------
    #
    # index.html references fingerprinted Vite assets.
    #
    # We do not aggressively cache index.html because a new
    # deployment may point it at different hashed JS/CSS
    # filenames.
    #
    # ------------------------------------------------------

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;

        try_files /index.html =404;
    }


    # ------------------------------------------------------
    # VITE FINGERPRINTED ASSETS
    # ------------------------------------------------------
    #
    # Vite emits content-hashed assets under /assets.
    #
    # Because the filename changes when the content changes,
    # these files can safely receive long-lived immutable
    # browser caching.
    #
    # ------------------------------------------------------

    location /assets/ {
        expires 1y;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;

        try_files $uri =404;
    }


    # ------------------------------------------------------
    # REACT SPA ROUTING
    # ------------------------------------------------------
    #
    # Examples:
    #
    #     /login
    #     /services
    #     /incidents
    #     /forgot-password
    #     /reset-password
    #
    # Those are browser application routes, not physical
    # files inside the container.
    #
    # If a real static file does not exist, return
    # /index.html so React Router can resolve the route.
    #
    # ------------------------------------------------------

    location / {
        try_files $uri $uri/ /index.html;
    }
}