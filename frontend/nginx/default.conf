# ==========================================================
# OPSFLOW FRONTEND — NGINX STATIC SERVER
# ==========================================================
#
# The React/Vite application is compiled during the Docker
# build and copied into:
#
#     /usr/share/nginx/html
#
# NGINX serves only those compiled static artifacts.
#
# React Router handles application routes in the browser.
# Unknown filesystem paths therefore fall back to
# index.html instead of returning an NGINX 404.
#
# ==========================================================


server {
    # ------------------------------------------------------
    # LISTEN PORT
    # ------------------------------------------------------
    #
    # 8080 is intentionally non-privileged.
    #
    # The Windows host publishes the service as:
    #
    #     http://localhost:5173
    #
    # ------------------------------------------------------

    listen 8080;
    listen [::]:8080;

    server_name _;


    # ------------------------------------------------------
    # STATIC APPLICATION ROOT
    # ------------------------------------------------------

    root /usr/share/nginx/html;
    index index.html;


    # ------------------------------------------------------
    # BASIC SERVER HARDENING
    # ------------------------------------------------------

    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;


    # ------------------------------------------------------
    # CONTAINER HEALTH ENDPOINT
    # ------------------------------------------------------
    #
    # This endpoint is intentionally served directly by
    # NGINX.
    #
    # It does not:
    #
    #     invoke React
    #     call FastAPI
    #     require authentication
    #     depend on static application routing
    #
    # Docker uses this endpoint only to verify that the
    # frontend HTTP server is alive and accepting requests.
    #
    # ------------------------------------------------------

    location = /healthz {
        access_log off;

        default_type text/plain;

        return 200 "ok\n";
    }


    # ------------------------------------------------------
    # INDEX.HTML
    # ------------------------------------------------------
    #
    # index.html references fingerprinted Vite assets.
    #
    # It should not receive long-lived immutable caching
    # because a future deployment may reference different
    # asset hashes.
    #
    # ------------------------------------------------------

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;

        try_files /index.html =404;
    }


    # ------------------------------------------------------
    # VITE FINGERPRINTED ASSETS
    # ------------------------------------------------------

    location /assets/ {
        expires 1y;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;

        try_files $uri =404;
    }


    # ------------------------------------------------------
    # REACT SPA ROUTING
    # ------------------------------------------------------

    location / {
        try_files $uri $uri/ /index.html;
    }
}